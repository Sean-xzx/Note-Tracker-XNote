name: Windows verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Rebuild SQLite for Electron
        run: npm run rebuild
      - name: Check repository, types, build and isolated runtime
        run: npm run verify
      - name: Package unpacked Windows application
        run: npm run pack:dir -- --config.win.signAndEditExecutable=false
      - name: Verify actual packaged executable and publication scope
        run: npm run test:package
