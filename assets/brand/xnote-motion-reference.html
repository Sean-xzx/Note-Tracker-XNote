<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>XNote 动效参考</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#FAF7F2; --surface:#F3ECE1; --line:#E2D5C2; --ink:#2B2622; --muted:#7A6E63; --clay:#D08A52;
    /* motion tokens */
    --dur-micro:120ms; --dur-base:180ms; --dur-panel:240ms;
    --ease-out:cubic-bezier(.2,0,0,1); --ease-in:cubic-bezier(.4,0,1,1);
    --ease-marker:cubic-bezier(.65,0,.35,1);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:48px}
  h1{font:600 22px/1.3 Georgia,serif;margin:0 0 6px}
  p.lead{color:var(--muted);margin:0 0 36px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
  .card{background:#fff8;border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
  .card h2{font-size:14px;margin:0;font-weight:600}
  .card small{color:var(--muted)}
  .stage{height:180px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:14px;position:relative;overflow:hidden}
  button{align-self:flex-start;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
  button:hover{background:var(--surface)}

  /* ---------- the mark ---------- */
  .mark #xn-hl{transform-box:fill-box;transform-origin:left center}
  /* 1. launch draw-in (plays once) */
  .draw #xn-hl{animation:hl-in 320ms var(--ease-marker) both}
  .draw #xn-ink{animation:ink-in 360ms var(--ease-marker) 240ms both}
  .draw + .word{animation:fade-up 300ms var(--ease-out) 460ms both}
  @keyframes hl-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes ink-in{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
  @keyframes fade-up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .word{font:600 34px/1 Georgia,serif;letter-spacing:-.02em}

  /* 2. AI thinking loop (only while waiting for first token) */
  .thinking #xn-ink{opacity:.35}
  .thinking #xn-hl{animation:hl-think 1600ms var(--ease-marker) infinite}
  @keyframes hl-think{
    0%{transform:scaleX(0);opacity:1}
    45%{transform:scaleX(1);opacity:1}
    75%{transform:scaleX(1);opacity:1}
    100%{transform:scaleX(1);opacity:0}
  }
  .think-label{font-size:13px;color:var(--muted)}

  /* 3. user highlight sweep (text) */
  .para{font-size:15px;max-width:260px}
  mark.hl{background:none;color:inherit;position:relative;z-index:0}
  mark.hl::before{content:"";position:absolute;inset:.05em -.08em;background:rgba(208,138,82,.32);border-radius:2px;z-index:-1;
    transform-origin:left center;transform:scaleX(0)}
  mark.hl.on::before{animation:sweep 200ms var(--ease-marker) forwards}
  @keyframes sweep{to{transform:scaleX(1)}}

  /* 4. progress = highlighter bar */
  .track{width:240px;height:8px;background:var(--surface);border-radius:2px;overflow:hidden}
  .bar{height:100%;width:0;background:var(--clay);clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%);transition:width 400ms var(--ease-out)}

  /* 5. panel slide (standard UI motion) */
  .panel{position:absolute;right:0;top:0;bottom:0;width:46%;background:#fff;border-left:1px solid var(--line);
    transform:translateX(100%);transition:transform var(--dur-panel) var(--ease-out)}
  .panel.open{transform:none}

  @media (prefers-reduced-motion: reduce){
    *,*::before{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
    .thinking #xn-hl{animation:none;opacity:.6}
  }
</style>
</head>
<body>
<h1>XNote 动效参考</h1>
<p class="lead">一个动作贯穿全局:像马克笔一样"划过"。品牌动画仅三处,其余只用统一节奏的淡入/滑入。</p>

<div class="grid">
  <section class="card">
    <h2>① 开屏 · 划出 logo <small>(一次性,≈750ms)</small></h2>
    <div class="stage" id="s1"></div>
    <button onclick="play1()">重播</button>
  </section>

  <section class="card">
    <h2>② AI 思考中 <small>(仅等待首个字时循环)</small></h2>
    <div class="stage">
      <svg class="mark thinking" viewBox="20 20 60 60" width="28" height="28" aria-hidden="true">
        <g transform="translate(50 50) rotate(-50)"><polygon id="xn-hl" points="-26,-9 28,-9 24,9 -30,9" fill="#D08A52"/></g>
        <line id="xn-ink" x1="31" y1="27" x2="69" y2="73" pathLength="1" stroke="#2B2622" stroke-width="7" stroke-linecap="round"/>
      </svg>
      <span class="think-label">正在思考…</span>
    </div>
  </section>

  <section class="card">
    <h2>③ 划重点 <small>(用户操作,200ms 一扫而过)</small></h2>
    <div class="stage"><p class="para">间隔重复的关键在于 <mark class="hl" id="h1">在快要遗忘的时候复习</mark>,而不是频繁重读。</p></div>
    <button onclick="play3()">重播</button>
  </section>

  <section class="card">
    <h2>④ 进度条 = 一道荧光笔 <small>(索引 / 复习进度)</small></h2>
    <div class="stage"><div class="track"><div class="bar" id="bar"></div></div></div>
    <button onclick="play4()">重播</button>
  </section>

  <section class="card">
    <h2>⑤ 面板滑入 <small>(240ms,标准 UI 节奏)</small></h2>
    <div class="stage"><div class="panel" id="panel"></div></div>
    <button onclick="document.getElementById('panel').classList.toggle('open')">开 / 关</button>
  </section>
</div>

<script>
const MARK = `<svg class="mark draw" viewBox="20 20 60 60" width="56" height="56" aria-hidden="true">
  <g transform="translate(50 50) rotate(-50)"><polygon id="xn-hl" points="-26,-9 28,-9 24,9 -30,9" fill="#D08A52"/></g>
  <line id="xn-ink" x1="31" y1="27" x2="69" y2="73" pathLength="1" stroke="#2B2622" stroke-width="7" stroke-linecap="round" stroke-dasharray="1"/>
</svg><span class="word">XNote</span>`;
function play1(){ const s=document.getElementById('s1'); s.innerHTML=''; void s.offsetWidth; s.innerHTML=MARK; }
function play3(){ const h=document.getElementById('h1'); h.classList.remove('on'); void h.offsetWidth; h.classList.add('on'); }
function play4(){ const b=document.getElementById('bar'); b.style.transition='none'; b.style.width='0'; void b.offsetWidth;
  b.style.transition=''; let p=0; const t=setInterval(()=>{p+=20; b.style.width=p+'%'; if(p>=100) clearInterval(t);},450); }
play1(); setTimeout(play3,400); setTimeout(play4,400);
</script>
</body>
</html>
