<!-- XNote mark, structured for animation.
     #xn-hl  : highlighter stroke (clay). Animate with transform: scaleX(0→1),
               transform-box: fill-box; transform-origin: left center  → sweeps bottom-left → top-right.
     #xn-ink : ink stroke (pathLength=1). Animate stroke-dashoffset 1→0 → draws top-left → bottom-right.
     Final (static) state = exactly the brand icon: highlighter under ink, no blend modes. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 20 60 60" width="240" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g transform="translate(50 50) rotate(-50)">
    <polygon id="xn-hl" points="-26,-9 28,-9 24,9 -30,9" fill="#D08A52"/>
  </g>
  <line id="xn-ink" x1="31" y1="27" x2="69" y2="73" pathLength="1"
        stroke="#2B2622" stroke-width="7" stroke-linecap="round"
        stroke-dasharray="1" stroke-dashoffset="0"/>
</svg>
